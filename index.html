<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - 专业任务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #5B5FDE;
            --primary-light: #7B7FE8;
            --primary-dark: #4B4FCE;
            --success: #4ADE80;
            --warning: #FBD535;
            --danger: #F87171;
            --info: #60A5FA;
            --bg: #0F0F23;
            --bg-light: #1A1B3A;
            --bg-card: #1E1F3B;
            --text: #FFFFFF;
            --text-secondary: #9CA3AF;
            --border: rgba(255, 255, 255, 0.1);
            --glow: 0 0 20px rgba(91, 95, 222, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(91, 95, 222, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 127, 232, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-section {
            flex: 1;
        }

        .logo {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #5B5FDE, #7B7FE8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
            font-weight: 300;
            margin-top: 5px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text);
            transform: translateY(-2px);
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            min-width: 140px;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--glow);
            border-color: var(--primary);
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-top: 3px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 25px;
            margin-bottom: 40px;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 280px 1fr;
            }
            .right-panel {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-title {
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
            color: var(--text-secondary);
        }

        .nav-item:hover {
            background: rgba(91, 95, 222, 0.1);
            color: var(--text);
            transform: translateX(3px);
        }

        .nav-item.active {
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 4px 12px rgba(91, 95, 222, 0.3);
        }

        .nav-icon {
            font-size: 1.2em;
            width: 22px;
            text-align: center;
        }

        .nav-count {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .content-area {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            min-height: 600px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .view-title {
            font-size: 1.5em;
            font-weight: 600;
        }

        .view-actions {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            padding: 8px 16px;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .view-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text);
        }

        .quick-add {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .add-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            flex: 1;
            min-width: 180px;
        }

        .input-wrapper.main {
            min-width: 300px;
            flex: 2;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9em;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 95, 222, 0.1);
        }

        .btn {
            padding: 12px 24px;
            background: var(--primary);
            color: var(--text);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9em;
        }

        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg);
            color: var(--text);
        }

        .btn-success {
            background: var(--success);
        }

        .btn-danger {
            background: var(--danger);
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9em;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 6px 14px;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text);
        }

        .tasks-container {
            display: grid;
            gap: 12px;
        }

        .task-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        .task-card:hover {
            border-color: var(--primary);
            transform: translateX(3px);
            box-shadow: 0 4px 12px rgba(91, 95, 222, 0.2);
        }

        .task-card.has-subtasks {
            border-left: 3px solid var(--primary);
        }

        .task-main {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-checkbox:hover {
            background: rgba(91, 95, 222, 0.1);
        }

        .task-checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: var(--text);
            font-weight: bold;
        }

        .task-info {
            flex: 1;
        }

        .task-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .task-title {
            font-size: 1.05em;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-metadata {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .meta-badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .badge-work {
            background: rgba(91, 95, 222, 0.2);
            color: #A5A7FA;
        }

        .badge-personal {
            background: rgba(168, 85, 247, 0.2);
            color: #C4A5F7;
        }

        .badge-study {
            background: rgba(251, 213, 53, 0.2);
            color: #FDE68A;
        }

        .badge-health {
            background: rgba(74, 222, 128, 0.2);
            color: #86EFAC;
        }

        .priority-high {
            background: rgba(248, 113, 113, 0.2);
            color: #FCA5A5;
        }

        .priority-medium {
            background: rgba(251, 213, 53, 0.2);
            color: #FDE68A;
        }

        .priority-low {
            background: rgba(91, 95, 222, 0.2);
            color: #A5A7FA;
        }

        .recurring-badge {
            background: rgba(96, 165, 250, 0.2);
            color: #93C5FD;
        }

        .task-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95em;
        }

        .action-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text);
            transform: scale(1.1);
        }

        .subtasks-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .subtasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .subtasks-title {
            font-size: 0.9em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .subtasks-progress {
            font-size: 0.85em;
            color: var(--primary);
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            margin: 5px 0;
            background: var(--bg);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .subtask-item:hover {
            background: var(--bg-card);
        }

        .subtask-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .subtask-checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .subtask-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 0.8em;
        }

        .subtask-title {
            flex: 1;
            font-size: 0.9em;
        }

        .subtask-item.completed .subtask-title {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .panel-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .template-list {
            display: grid;
            gap: 10px;
        }

        .template-item {
            padding: 12px;
            background: var(--bg-light);
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .template-item:hover {
            background: var(--bg);
            border-color: var(--primary);
        }

        .template-name {
            font-weight: 500;
            font-size: 0.95em;
        }

        .template-count {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 0.85em;
            font-weight: 500;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 10px;
            color: var(--text);
            font-weight: 500;
            box-shadow: var(--glow);
            z-index: 2000;
            animation: slideInRight 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: var(--bg-light);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-top">
                <div class="logo-section">
                    <h1 class="logo">TaskFlow Pro</h1>
                    <p class="subtitle">专业级任务管理系统</p>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="openTemplateModal()">
                        📋 任务模板
                    </button>
                    <button class="header-btn" onclick="exportData()">
                        📥 导出数据
                    </button>
                    <button class="header-btn" onclick="showStats()">
                        📊 统计分析
                    </button>
                </div>
            </div>
            
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">总任务</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="todayTasks">0</div>
                    <div class="stat-label">今日待办</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="recurringTasks">0</div>
                    <div class="stat-label">循环任务</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">完成率</div>
                </div>
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="nav-section">
                    <div class="nav-title">视图</div>
                    <div class="nav-item active" data-view="today">
                        <span class="nav-icon">⚡</span>
                        <span>今日聚焦</span>
                        <span class="nav-count" id="todayCount">0</span>
                    </div>
                    <div class="nav-item" data-view="week">
                        <span class="nav-icon">📅</span>
                        <span>本周计划</span>
                        <span class="nav-count" id="weekCount">0</span>
                    </div>
                    <div class="nav-item" data-view="all">
                        <span class="nav-icon">🗂️</span>
                        <span>全部任务</span>
                        <span class="nav-count" id="allCount">0</span>
                    </div>
                    <div class="nav-item" data-view="recurring">
                        <span class="nav-icon">🔄</span>
                        <span>循环任务</span>
                        <span class="nav-count" id="recurCount">0</span>
                    </div>
                    <div class="nav-item" data-view="completed">
                        <span class="nav-icon">✨</span>
                        <span>已完成</span>
                        <span class="nav-count" id="doneCount">0</span>
                    </div>
                </div>
                
                <div class="nav-section">
                    <div class="nav-title">分类</div>
                    <div class="nav-item" data-view="work">
                        <span class="nav-icon">💼</span>
                        <span>工作</span>
                    </div>
                    <div class="nav-item" data-view="personal">
                        <span class="nav-icon">🏠</span>
                        <span>个人</span>
                    </div>
                    <div class="nav-item" data-view="study">
                        <span class="nav-icon">📚</span>
                        <span>学习</span>
                    </div>
                    <div class="nav-item" data-view="health">
                        <span class="nav-icon">❤️</span>
                        <span>健康</span>
                    </div>
                </div>
            </aside>

            <main class="content-area">
                <div class="content-header">
                    <h2 class="view-title" id="viewTitle">今日聚焦</h2>
                    <div class="view-actions">
                        <button class="view-btn" onclick="toggleBatchMode()">
                            🔲 批量操作
                        </button>
                        <button class="view-btn" onclick="mergeTasks()">
                            🔗 合并任务
                        </button>
                    </div>
                </div>

                <div class="quick-add">
                    <div class="add-form">
                        <div class="input-wrapper main">
                            <input type="text" id="taskInput" placeholder="添加新任务，按回车快速创建..." />
                        </div>
                        <div class="input-wrapper">
                            <select id="categorySelect">
                                <option value="work">💼 工作</option>
                                <option value="personal">🏠 个人</option>
                                <option value="study">📚 学习</option>

            <aside class="right-panel">

                    <div class="template-list" id="templateList">

                                <div class="template-count">3个任务</div>

                                <div class="template-name">项目启动</div>

                            <span>→</span>
                        </div>

                            <span id="todayProgress">0</span>%

    <!-- 高级创建模态框 -->
    <div id="advancedModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-header">高级任务创建</h2>
            
            <div class="form-group">
                <label class="form-label">任务标题 *</label>
                <input type="text" id="advTaskTitle" placeholder="输入任务标题" />
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <select id="advCategory">
                        <option value="work">💼 工作</option>
                        <option value="personal">🏠 个人</option>
                        <option value="study">📚 学习</option>
                        <option value="health">❤️ 健康</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">优先级</label>
                    <select id="advPriority">
                        <option value="low">🔵 低优先</option>
                        <option value="medium">🟡 中优先</option>
                        <option value="high">🔴 高优先</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">开始日期</label>
                    <input type="date" id="advStartDate" />
                </div>
                
                <div class="form-group">
                    <label class="form-label">截止日期</label>
                    <input type="date" id="advDueDate" />
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">循环设置</label>
                <select id="advRecurring" onchange="toggleRecurringOptions()">
                    <option value="none">不循环</option>
                    <option value="daily">每日</option>
                    <option value="weekly">每周</option>
                    <option value="monthly">每月</option>
                    <option value="custom">自定义</option>
                </select>
            </div>
            
            <div class="form-group" id="recurringOptions" style="display: none;">
                <label class="form-label">循环间隔（天）</label>
                <input type="number" id="advRecurInterval" value="1" min="1" />
            </div>
            
            <div class="form-group">
                <label class="form-label">任务描述</label>
                <textarea id="advDescription" placeholder="添加详细描述..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">子任务（每行一个）</label>
                <textarea id="advSubtasks" placeholder="子任务1
子任务2
子任务3" rows="4"></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">标签（空格分隔）</label>
                <input type="text" id="advTags" placeholder="例如: 重要 紧急 会议" />
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAdvancedModal()">取消</button>
                <button class="btn" onclick="createAdvancedTask()">创建任务</button>
            </div>
        </div>
    </div>

    <script>
        // 应用核心数据
        let tasks = JSON.parse(localStorage.getItem('taskflow_pro_tasks')) || [];
        let templates = JSON.parse(localStorage.getItem('taskflow_pro_templates')) || getDefaultTemplates();
        let currentView = 'today';
        let currentFilter = 'all';
        let editingTaskId = null;
        let batchMode = false;
        let selectedTasks = new Set();

        // 初始化应用
        function init() {
            loadTasks();
            updateStats();
            updateSidebarCounts();
            setupEventListeners();
            loadTemplates();
            
            // 每分钟检查循环任务
            setInterval(() => {
                checkRecurringTasks();
                updateStats();
            }, 60000);
            
            // 初次检查循环任务
            checkRecurringTasks();
        }

        // 获取默认模板
        function getDefaultTemplates() {
            return {
                daily: {
                    name: '每日晨会',
                    tasks: [
                        { title: '准备晨会议题', category: 'work', priority: 'high' },
                        { title: '整理昨日进度', category: 'work', priority: 'medium' },
                        { title: '更新任务看板', category: 'work', priority: 'medium' }
                    ]
                },
                weekly: {
                    name: '周报准备',
                    tasks: [
                        { title: '收集本周完成任务', category: 'work', priority: 'high' },
                        { title: '整理项目进度', category: 'work', priority: 'high' },
                        { title: '分析问题与风险', category: 'work', priority: 'medium' },
                        { title: '制定下周计划', category: 'work', priority: 'medium' },
                        { title: '编写周报文档', category: 'work', priority: 'low' }
                    ]
                },
                project: {
                    name: '项目启动',
                    tasks: [
                        { title: '需求分析', category: 'work', priority: 'high', subtasks: ['收集需求', '需求评审', '需求确认'] },
                        { title: '技术方案设计', category: 'work', priority: 'high', subtasks: ['架构设计', '数据库设计', '接口设计'] },
                        { title: '项目计划制定', category: 'work', priority: 'high' },
                        { title: '资源协调', category: 'work', priority: 'medium' },
                        { title: '风险评估', category: 'work', priority: 'medium' },
                        { title: '项目启动会议', category: 'work', priority: 'high' },
                        { title: '文档准备', category: 'work', priority: 'low' },
                        { title: '开发环境搭建', category: 'work', priority: 'medium' }
                    ]
                }
            };
        }

        // 设置事件监听
        function setupEventListeners() {
            // 导航切换
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    this.classList.add('active');
                    currentView = this.dataset.view;
                    updateViewTitle();
                    loadTasks();
                });
            });

            // 筛选切换
            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    loadTasks();
                });
            });

            // 回车快速添加
            document.getElementById('taskInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    quickAddTask();
                }
            });

            // 点击模态框外部关闭
            document.getElementById('advancedModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeAdvancedModal();
                }
            });

            // ESC键关闭模态框
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeAdvancedModal();
                }
            });
        }

        // 更新视图标题
        function updateViewTitle() {
            const titles = {
                today: '今日聚焦',
                week: '本周计划',
                all: '全部任务',
                recurring: '循环任务',
                completed: '已完成',
                work: '工作任务',
                personal: '个人事务',
                study: '学习计划',
                health: '健康管理'
            };
            document.getElementById('viewTitle').textContent = titles[currentView] || '任务列表';
        }

        // 快速添加任务
        function quickAddTask() {
            const input = document.getElementById('taskInput');
            const category = document.getElementById('categorySelect').value;
            const priority = document.getElementById('prioritySelect').value;

            if (!input.value.trim()) {
                showNotification('请输入任务内容', 'warning');
                return;
            }

            const task = {
                id: Date.now(),
                title: input.value.trim(),
                category,
                priority,
                dueDate: new Date().toISOString().split('T')[0],
                completed: false,
                createdAt: new Date().toISOString(),
                subtasks: [],
                tags: [],
                recurring: 'none'
            };

            tasks.unshift(task);
            saveTasks();
            loadTasks();
            updateStats();
            updateSidebarCounts();

            input.value = '';
            showNotification('✅ 任务创建成功');
        }

        // 打开高级创建模态框
        function openAdvancedAdd() {
            document.getElementById('advancedModal').classList.add('active');
            document.getElementById('advStartDate').value = new Date().toISOString().split('T')[0];
        }

        // 关闭高级创建模态框
        function closeAdvancedModal() {
            document.getElementById('advancedModal').classList.remove('active');
            // 清空表单
            document.getElementById('advTaskTitle').value = '';
            document.getElementById('advDescription').value = '';
            document.getElementById('advSubtasks').value = '';
            document.getElementById('advTags').value = '';
        }

        // 切换循环选项显示
        function toggleRecurringOptions() {
            const recurring = document.getElementById('advRecurring').value;
            const optionsDiv = document.getElementById('recurringOptions');
            optionsDiv.style.display = recurring === 'custom' ? 'block' : 'none';
        }

        // 创建高级任务
        function createAdvancedTask() {
            const title = document.getElementById('advTaskTitle').value.trim();
            if (!title) {
                showNotification('请输入任务标题', 'warning');
                return;
            }

            const subtasksText = document.getElementById('advSubtasks').value.trim();
            const subtasks = subtasksText ? subtasksText.split('\n').filter(s => s.trim()).map(s => ({
                id: Date.now() + Math.random(),
                title: s.trim(),
                completed: false
            })) : [];

            const tagsText = document.getElementById('advTags').value.trim();
            const tags = tagsText ? tagsText.split(' ').filter(t => t.trim()) : [];

            const task = {
                id: Date.now(),
                title,
                category: document.getElementById('advCategory').value,
                priority: document.getElementById('advPriority').value,
                startDate: document.getElementById('advStartDate').value,
                dueDate: document.getElementById('advDueDate').value,
                description: document.getElementById('advDescription').value,
                recurring: document.getElementById('advRecurring').value,
                recurInterval: parseInt(document.getElementById('advRecurInterval').value) || 1,
                completed: false,
                createdAt: new Date().toISOString(),
                subtasks,
                tags,
                lastRecurDate: new Date().toISOString()
            };

            tasks.unshift(task);
            saveTasks();
            loadTasks();
            updateStats();
            updateSidebarCounts();
            closeAdvancedModal();
            showNotification('🎯 高级任务创建成功');
        }

        // 检查循环任务
        function checkRecurringTasks() {
            const today = new Date().toISOString().split('T')[0];
            let hasNewTasks = false;

            tasks.forEach(task => {
                if (task.recurring !== 'none' && !task.completed) {
                    const lastDate = new Date(task.lastRecurDate || task.createdAt);
                    const daysSince = Math.floor((new Date() - lastDate) / (1000 * 60 * 60 * 24));
                    
                    let shouldCreate = false;
                    switch (task.recurring) {
                        case 'daily':
                            shouldCreate = daysSince >= 1;
                            break;
                        case 'weekly':
                            shouldCreate = daysSince >= 7;
                            break;
                        case 'monthly':
                            shouldCreate = daysSince >= 30;
                            break;
                        case 'custom':
                            shouldCreate = daysSince >= (task.recurInterval || 1);
                            break;
                    }

                    if (shouldCreate) {
                        const newTask = {
                            ...task,
                            id: Date.now() + Math.random(),
                            createdAt: new Date().toISOString(),
                            dueDate: today,
                            completed: false,
                            parentRecurringId: task.id
                        };
                        
                        if (newTask.subtasks) {
                            newTask.subtasks = newTask.subtasks.map(st => ({
                                ...st,
                                id: Date.now() + Math.random(),
                                completed: false
                            }));
                        }

                        tasks.unshift(newTask);
                        task.lastRecurDate = new Date().toISOString();
                        hasNewTasks = true;
                    }
                }
            });

            if (hasNewTasks) {
                saveTasks();
                loadTasks();
                updateStats();
                showNotification('🔄 循环任务已自动生成');
            }
        }

        // 应用模板
        function applyTemplate(templateKey) {
            const template = templates[templateKey];
            if (!template) return;

            const confirmApply = confirm(`确定要应用"${template.name}"模板吗？将创建${template.tasks.length}个新任务。`);
            if (!confirmApply) return;

            const today = new Date().toISOString().split('T')[0];
            template.tasks.forEach((taskData, index) => {
                const task = {
                    id: Date.now() + index,
                    title: taskData.title,
                    category: taskData.category || 'work',
                    priority: taskData.priority || 'medium',
                    dueDate: today,
                    completed: false,
                    createdAt: new Date().toISOString(),
                    subtasks: taskData.subtasks ? taskData.subtasks.map(st => ({
                        id: Date.now() + Math.random(),
                        title: st,
                        completed: false
                    })) : [],
                    tags: taskData.tags || [],
                    recurring: 'none'
                };
                tasks.unshift(task);
            });

            saveTasks();
            loadTasks();
            updateStats();
            updateSidebarCounts();
            showNotification(`✨ 已应用"${template.name}"模板`);
        }

        // 切换任务状态
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                task.completedAt = task.completed ? new Date().toISOString() : null;
                
                // 如果有子任务，同步更新
                if (task.subtasks && task.subtasks.length > 0) {
                    task.subtasks.forEach(st => st.completed = task.completed);
                }
                
                saveTasks();
                loadTasks();
                updateStats();
                updateSidebarCounts();
                
                if (task.completed) {
                    showNotification('🎉 任务完成！');
                }
            }
        }

        // 切换子任务状态
        function toggleSubtask(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.subtasks) {
                const subtask = task.subtasks.find(st => st.id === subtaskId);
                if (subtask) {
                    subtask.completed = !subtask.completed;
                    
                    // 检查是否所有子任务都完成
                    const allCompleted = task.subtasks.every(st => st.completed);
                    if (allCompleted && !task.completed) {
                        task.completed = true;
                        task.completedAt = new Date().toISOString();
                        showNotification('🎉 所有子任务完成！');
                    } else if (!allCompleted && task.completed) {
                        task.completed = false;
                        task.completedAt = null;
                    }
                    
                    saveTasks();
                    loadTasks();
                    updateStats();
                }
            }
        }

        // 添加子任务
        function addSubtask(taskId) {
            const title = prompt('请输入子任务名称：');
            if (!title || !title.trim()) return;

            const task = tasks.find(t => t.id === taskId);
            if (task) {
                if (!task.subtasks) task.subtasks = [];
                task.subtasks.push({
                    id: Date.now() + Math.random(),
                    title: title.trim(),
                    completed: false
                });
                
                saveTasks();
                loadTasks();
                showNotification('✅ 子任务添加成功');
            }
        }

        // 删除任务
        function deleteTask(id) {
            if (confirm('确定要删除这个任务吗？')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                loadTasks();
                updateStats();
                updateSidebarCounts();
                showNotification('🗑️ 任务已删除');
            }
        }

        // 批量操作模式
        function toggleBatchMode() {
            batchMode = !batchMode;
            selectedTasks.clear();
            loadTasks();
            
            if (batchMode) {
                showNotification('📋 批量操作模式已开启');
            }
        }

        // 合并任务
        function mergeTasks() {
            if (selectedTasks.size < 2) {
                showNotification('请至少选择2个任务进行合并', 'warning');
                return;
            }

            const selectedTasksArray = Array.from(selectedTasks).map(id => 
                tasks.find(t => t.id === id)
            ).filter(t => t);

            const mergedTitle = prompt('请输入合并后的任务标题：', selectedTasksArray[0].title);
            if (!mergedTitle) return;

            const mergedTask = {
                id: Date.now(),
                title: mergedTitle,
                category: selectedTasksArray[0].category,
                priority: 'high',
                dueDate: selectedTasksArray[0].dueDate,
                completed: false,
                createdAt: new Date().toISOString(),
                subtasks: [],
                tags: [],
                recurring: 'none',
                description: '合并的任务：\n' + selectedTasksArray.map(t => `- ${t.title}`).join('\n')
            };

            // 将原任务转为子任务
            selectedTasksArray.forEach(task => {
                mergedTask.subtasks.push({
                    id: Date.now() + Math.random(),
                    title: task.title,
                    completed: task.completed
                });
                
                // 如果原任务有子任务，添加到新的子任务列表
                if (task.subtasks) {
                    task.subtasks.forEach(st => {
                        mergedTask.subtasks.push({
                            id: Date.now() + Math.random(),
                            title: `  └─ ${st.title}`,
                            completed: st.completed
                        });
                    });
                }
            });

            // 删除原任务
            tasks = tasks.filter(t => !selectedTasks.has(t.id));
            
            // 添加合并后的任务
            tasks.unshift(mergedTask);
            
            saveTasks();
            toggleBatchMode();
            loadTasks();
            updateStats();
            showNotification('🔗 任务合并成功');
        }

        // 搜索任务
        function searchTasks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            loadTasks(searchTerm);
        }

        // 加载任务列表
        function loadTasks(searchTerm = '') {
            const taskList = document.getElementById('taskList');
            let filteredTasks = [...tasks];

            // 视图筛选
            const today = new Date().toDateString();
            const weekEnd = new Date();
            weekEnd.setDate(weekEnd.getDate() + 7);

            switch (currentView) {
                case 'today':
                    filteredTasks = filteredTasks.filter(t => 
                        !t.completed && t.dueDate && new Date(t.dueDate).toDateString() === today
                    );
                    break;
                case 'week':
                    filteredTasks = filteredTasks.filter(t => 
                        !t.completed && t.dueDate && new Date(t.dueDate) <= weekEnd
                    );
                    break;
                case 'recurring':
                    filteredTasks = filteredTasks.filter(t => t.recurring !== 'none');
                    break;
                case 'completed':
                    filteredTasks = filteredTasks.filter(t => t.completed);
                    break;
                case 'work':
                case 'personal':
                case 'study':
                case 'health':
                    filteredTasks = filteredTasks.filter(t => t.category === currentView);
                    break;
            }

            // 优先级筛选
            if (currentFilter !== 'all') {
                if (currentFilter === 'parent') {
                    filteredTasks = filteredTasks.filter(t => t.subtasks && t.subtasks.length > 0);
                } else if (currentView !== 'completed') {
                    filteredTasks = filteredTasks.filter(t => t.priority === currentFilter);
                }
            }

            // 搜索筛选
            if (searchTerm) {
                filteredTasks = filteredTasks.filter(t => 
                    t.title.toLowerCase().includes(searchTerm) ||
                    (t.description && t.description.toLowerCase().includes(searchTerm)) ||
                    (t.tags && t.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
                );
            }

            // 排序
            filteredTasks.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                const priorityOrder = { high: 0, medium: 1, low: 2 };
                if (a.priority !== b.priority) {
                    return priorityOrder[a.priority] - priorityOrder[b.priority];
                }
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            // 渲染
            if (filteredTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div class="empty-title">暂无任务</div>
                        <p>${currentView === 'today' ? '今天没有待办事项' : '点击上方添加新任务'}</p>
                    </div>
                `;
            } else {
                taskList.innerHTML = filteredTasks.map(task => renderTaskCard(task)).join('');
            }
        }

        // 渲染任务卡片
        function renderTaskCard(task) {
            const categoryEmoji = {
                work: '💼',
                personal: '🏠',
                study: '📚',
                health: '❤️'
            };

            const priorityLabel = {
                high: '高',
                medium: '中',
                low: '低'
            };

            const hasSubtasks = task.subtasks && task.subtasks.length > 0;
            const completedSubtasks = hasSubtasks ? task.subtasks.filter(st => st.completed).length : 0;

            let html = `
                <div class="task-card ${task.completed ? 'completed' : ''} ${hasSubtasks ? 'has-subtasks' : ''}">
                    <div class="task-main">
                        ${batchMode ? `
                            <input type="checkbox" 
                                   onchange="toggleTaskSelection(${task.id})" 
                                   ${selectedTasks.has(task.id) ? 'checked' : ''} />
                        ` : ''}
                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                             onclick="toggleTask(${task.id})"></div>
                        <div class="task-info">
                            <div class="task-header">
                                <div>
                                    <div class="task-title">${escapeHtml(task.title)}</div>
                                    <div class="task-metadata">
                                        <span class="meta-badge badge-${task.category}">
                                            ${categoryEmoji[task.category]} ${getCategoryLabel(task.category)}
                                        </span>
                                        <span class="meta-badge priority-${task.priority}">
                                            ${getPriorityIcon(task.priority)} ${priorityLabel[task.priority]}优先
                                        </span>
                                        ${task.recurring !== 'none' ? `
                                            <span class="meta-badge recurring-badge">
                                                🔄 ${getRecurringLabel(task.recurring)}
                                            </span>
                                        ` : ''}
                                        ${task.dueDate ? `
                                            <span class="meta-badge">
                                                📅 ${formatDate(task.dueDate)}
                                            </span>
                                        ` : ''}
                                        ${task.tags && task.tags.length > 0 ? 
                                            task.tags.map(tag => `
                                                <span class="meta-badge" style="background: var(--bg); border: 1px solid var(--border);">
                                                    #${tag}
                                                </span>
                                            `).join('') : ''
                                        }
                                    </div>
                                    ${task.description ? `
                                        <div style="margin-top: 8px; color: var(--text-secondary); font-size: 0.85em;">
                                            💭 ${escapeHtml(task.description)}
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="task-actions">
                                    <button class="action-btn" onclick="addSubtask(${task.id})" title="添加子任务">
                                        ➕
                                    </button>
                                    <button class="action-btn" onclick="editTask(${task.id})" title="编辑">
                                        ✏️
                                    </button>
                                    <button class="action-btn" onclick="deleteTask(${task.id})" title="删除">
                                        🗑️
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
            `;

            // 添加子任务部分
            if (hasSubtasks) {
                html += `
                    <div class="subtasks-section">
                        <div class="subtasks-header">
                            <div class="subtasks-title">
                                📋 子任务
                            </div>
                            <div class="subtasks-progress">
                                ${completedSubtasks}/${task.subtasks.length} 完成
                            </div>
                        </div>
                        ${task.subtasks.map(subtask => `
                            <div class="subtask-item ${subtask.completed ? 'completed' : ''}">
                                <div class="subtask-checkbox ${subtask.completed ? 'checked' : ''}"
                                     onclick="toggleSubtask(${task.id}, ${subtask.id})"></div>
                                <div class="subtask-title">${escapeHtml(subtask.title)}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            html += '</div>';
            return html;
        }

        // 切换任务选择（批量操作）
        function toggleTaskSelection(taskId) {
            if (selectedTasks.has(taskId)) {
                selectedTasks.delete(taskId);
            } else {
                selectedTasks.add(taskId);
            }
        }

        // 编辑任务（简化版，可扩展）
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            const newTitle = prompt('编辑任务标题：', task.title);
            if (newTitle && newTitle.trim()) {
                task.title = newTitle.trim();
                saveTasks();
                loadTasks();
                showNotification('📝 任务已更新');
            }
        }

        // 获取分类标签
        function getCategoryLabel(category) {
            const labels = {
                work: '工作',
                personal: '个人',
                study: '学习',
                health: '健康'
            };
            return labels[category];
        }

        // 获取优先级图标
        function getPriorityIcon(priority) {
            const icons = {
                high: '🔴',
                medium: '🟡',
                low: '🔵'
            };
            return icons[priority];
        }

        // 获取循环标签
        function getRecurringLabel(recurring) {
            const labels = {
                daily: '每日',
                weekly: '每周',
                monthly: '每月',
                custom: '自定义'
            };
            return labels[recurring] || '';
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            if (date.toDateString() === today.toDateString()) {
                return '今天';
            } else if (date.toDateString() === tomorrow.toDateString()) {
                return '明天';
            } else {
                return `${date.getMonth() + 1}/${date.getDate()}`;
            }
        }

        // HTML转义
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // 更新统计
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const today = new Date().toDateString();
            const todayTasks = tasks.filter(t => 
                t.dueDate && new Date(t.dueDate).toDateString() === today
            );
            const todayCount = todayTasks.filter(t => !t.completed).length;
            const todayCompleted = todayTasks.filter(t => t.completed).length;
            const recurringCount = tasks.filter(t => t.recurring !== 'none').length;
            const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('todayTasks').textContent = todayCount;
            document.getElementById('recurringTasks').textContent = recurringCount;
            document.getElementById('completionRate').textContent = completionRate + '%';

            // 更新进度条
            document.getElementById('progressBar').style.width = completionRate + '%';

            // 更新右侧面板的今日进度
            const todayProgress = todayTasks.length > 0 ? 
                Math.round((todayCompleted / todayTasks.length) * 100) : 0;
            document.getElementById('todayProgress').textContent = todayProgress;
            document.getElementById('todayCompleted').textContent = todayCompleted;
            document.getElementById('todayTotal').textContent = todayTasks.length;
        }

        // 更新侧边栏计数
        function updateSidebarCounts() {
            const today = new Date().toDateString();
            const weekEnd = new Date();
            weekEnd.setDate(weekEnd.getDate() + 7);

            const counts = {
                today: tasks.filter(t => !t.completed && t.dueDate && 
                    new Date(t.dueDate).toDateString() === today).length,
                week: tasks.filter(t => !t.completed && t.dueDate && 
                    new Date(t.dueDate) <= weekEnd).length,
                all: tasks.filter(t => !t.completed).length,
                recur: tasks.filter(t => t.recurring !== 'none').length,
                done: tasks.filter(t => t.completed).length
            };

            document.getElementById('todayCount').textContent = counts.today;
            document.getElementById('weekCount').textContent = counts.week;
            document.getElementById('allCount').textContent = counts.all;
            document.getElementById('recurCount').textContent = counts.recur;
            document.getElementById('doneCount').textContent = counts.done;
        }

        // 加载模板列表
        function loadTemplates() {
            // 可以在这里扩展自定义模板功能
        }

        // 打开模板管理
        function openTemplateModal() {
            showNotification('📋 模板管理功能开发中...');
        }

        // 导出数据
        function exportData() {
            const dataStr = JSON.stringify(tasks, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `taskflow_export_${new Date().toISOString().split('T')[0]}.json`;

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            
            showNotification('📥 数据导出成功');
        }

        // 显示统计分析
        function showStats() {
            showNotification('📊 统计分析功能开发中...');
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            
            if (type === 'warning') {
                notification.style.borderColor = 'var(--warning)';
            }
            
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // 保存任务
        function saveTasks() {
            localStorage.setItem('taskflow_pro_tasks', JSON.stringify(tasks));
        }

        // 保存模板
        function saveTemplates() {
            localStorage.setItem('taskflow_pro_templates', JSON.stringify(templates));
        }

        // 启动应用
        init();
    </script>
</body>
</html>
